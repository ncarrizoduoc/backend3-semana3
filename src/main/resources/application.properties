spring.application.name=banco

spring.datasource.url=jdbc:mysql://localhost:3306/backend_3
spring.datasource.username=myuser
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.platform=mysql

app.input-cuentas=classpath:cuentas_anuales.csv
app.input-intereses=classpath:intereses.csv
app.input-transacciones=classpath:transacciones.csv

spring.batch.jdbc.initialize-schema=always

spring.batch.job.enabled=false

# Archivo para guardar logs
logging.file.name=logs/app.log